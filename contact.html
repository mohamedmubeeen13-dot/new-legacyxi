<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LEGACY XI | Contact Us</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="container nav-container">
      <a href="index.html" class="logo">LEGACY <span>XI</span></a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">All Kits</a></li>
        <li><a href="contact.html" class="active">Contact</a></li>
      </ul>
    </div>
  </header>

  <main class="container" style="padding: 4rem 0; max-width: 600px;">
    <h1 style="font-family: var(--font-heading); margin-bottom: 2rem;">GET IN TOUCH</h1>
    <form style="background: var(--bg-card); padding: 2rem; border-radius: var(--radius-md); border: 1px solid var(--bg-border);">
      <div style="margin-bottom: 1rem;">
        <label>Your Name</label>
        <input type="text" class="input-field" required>
      </div>
      <div style="margin-bottom: 1rem;">
        <label>Email Address</label>
        <input type="email" class="input-field" required>
      </div>
      <div style="margin-bottom: 1.5rem;">
        <label>Message</label>
        <textarea rows="5" class="input-field" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width: 100%;">SEND MESSAGE</button>
    </form>
  </main>

</body>
</html>
